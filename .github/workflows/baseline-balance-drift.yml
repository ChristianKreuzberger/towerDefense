name: baseline-balance-drift

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build and deterministic baseline drift check
        run: npm run baseline:balance:verify:ci
