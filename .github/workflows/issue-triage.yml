name: Issue Triage

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  models: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Triage issue with AI
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.issue.number;
            const issue = context.payload.issue;

            // ---------------------------------------------------------------
            // Build the triage prompt
            // ---------------------------------------------------------------
            const prompt = `You are an expert software-engineering triage assistant for a browser-based tower defense game project.

Repository context:
- Game: offline-first, local multiplayer, 1-8 players
- Each player places one tower; towers defend against creatures
- Players earn/spend points; first to 1000 wins
- Stack: TypeScript, Vite client, Node.js server, monorepo

Relevant spec files (for reference in acceptance criteria):
  spec/02-gameplay-rules.md, spec/04-technical-architecture.md,
  spec/05-map-system.md, spec/06-economy-balance.md, spec/11-match-flow-ui.md

Issue to triage:
Title: ${issue.title}
Body: ${issue.body || '(no description provided)'}
Existing labels: ${issue.labels.map(l => l.name).join(', ') || 'none'}

Your task:
Determine whether this issue has enough detail for an autonomous coding agent
to implement or fix it without asking further questions.

Respond ONLY with a JSON object — no markdown fences — in this exact shape:
{
  "label": "ready-for-agent" | "needs-info",
  "comment": "<your triage comment>"
}

Label as "ready-for-agent" if ALL apply:
- The desired change or bug is clearly described
- Expected behaviour / acceptance criteria are stated or unambiguous
- No outstanding design decisions block implementation
- Scope is reasonably bounded

Label as "needs-info" if ANY apply:
- Description is vague or missing steps to reproduce / expected vs actual
- A human design decision is required before coding can start
- Scope is unclear or extremely broad

Your comment must:
- Restate the issue in one sentence in your own words
- If ready-for-agent: list 3–5 concrete acceptance criteria and note relevant spec files
- If needs-info: list the specific questions that must be answered first
- Be concise and actionable`;

            // ---------------------------------------------------------------
            // Call GitHub Models inference (no external credentials needed)
            // ---------------------------------------------------------------
            const { Octokit } = require('@octokit/core');
            const token = process.env.GITHUB_TOKEN;

            const inferenceRes = await fetch(
              'https://models.inference.ai.azure.com/chat/completions',
              {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  Authorization: 'Bearer ' + token
                },
                body: JSON.stringify({
                  model: 'gpt-4o-mini',
                  messages: [{ role: 'user', content: prompt }],
                  temperature: 0.2,
                  max_tokens: 800
                })
              }
            );

            let label = 'needs-info';
            let comment = 'Automated triage could not determine issue completeness. Please review manually.';

            if (inferenceRes.ok) {
              const data = await inferenceRes.json();
              const raw = data.choices[0].message.content.trim();
              try {
                const parsed = JSON.parse(raw);
                if (parsed.label === 'ready-for-agent' || parsed.label === 'needs-info') {
                  label = parsed.label;
                }
                if (parsed.comment) comment = parsed.comment;
              } catch {
                core.warning('Could not parse AI response as JSON; defaulting to needs-info');
              }
            } else {
              core.warning(`AI inference returned ${inferenceRes.status}; defaulting to needs-info`);
            }

            // ---------------------------------------------------------------
            // Ensure both labels exist in the repo
            // ---------------------------------------------------------------
            const labelDefs = [
              { name: 'ready-for-agent', color: '0e8a16', description: 'Enough detail for an agent to work on' },
              { name: 'needs-info',      color: 'd93f0b', description: 'More information needed before work can begin' }
            ];
            for (const l of labelDefs) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner, repo: context.repo.repo, name: l.name
                });
              } catch {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner, repo: context.repo.repo, ...l
                });
              }
            }

            // ---------------------------------------------------------------
            // Remove the opposite label if present, then apply chosen label
            // ---------------------------------------------------------------
            const opposite = label === 'ready-for-agent' ? 'needs-info' : 'ready-for-agent';
            if (issue.labels.some(l => l.name === opposite)) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issueNumber, name: opposite
                });
              } catch { /* label may already be gone */ }
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issueNumber, labels: [label]
            });

            // ---------------------------------------------------------------
            // Post (or update) the triage comment
            // ---------------------------------------------------------------
            const body = [
              '<!-- triage-bot -->',
              '## 🤖 Automated Triage',
              '',
              comment,
              '',
              '---',
              `*Label applied: \`${label}\` — edit this issue to trigger re-triage.*`
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber
            });
            const existing = comments.find(c => c.body && c.body.startsWith('<!-- triage-bot -->'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issueNumber, body
              });
            }

            core.info(`Triage complete: label=${label}`);
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
