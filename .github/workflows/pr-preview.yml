name: PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

# One run per PR; a newer push supersedes the older build.
concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    # Fork PRs get a read-only token, so they cannot push to gh-pages.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        if: github.event.action != 'closed'
        run: npm ci

      - name: Build libraries
        if: github.event.action != 'closed'
        run: npm run build -w @tower-defense/shared -w @tower-defense/simulation -w @tower-defense/transport

      # Same static build as deploy.yml, served from a per-PR sub-path.
      - name: Build client
        if: github.event.action != 'closed'
        working-directory: apps/client
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}/
          VITE_IN_BROWSER_SERVER: "true"
        run: npm run build

      # Publishes to gh-pages/pr-preview/pr-N on open/push, removes it on close, and comments the URL.
      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: apps/client/dist
