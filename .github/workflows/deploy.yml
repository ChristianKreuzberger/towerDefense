name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Allow only one concurrent deployment; cancel in-progress runs.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # Workspace libraries must be compiled before Vite bundles the client.
      - name: Build libraries
        run: npm run build -w @tower-defense/shared -w @tower-defense/simulation -w @tower-defense/transport

      # Pages is static, so the client runs the game server in the browser instead of calling /api.
      - name: Build client
        working-directory: apps/client
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_IN_BROWSER_SERVER: "true"
        # Not `npm run build`: its `tsc -b` step would emit .d.ts/.js files into the published dist.
        run: npx vite build

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: client-dist
          path: apps/client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The deploy action pushes from a git checkout; without one it fails with "not in a git directory".
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: dist

      # Pages serves the gh-pages branch so PR previews can live under pr-preview/.
      # clean-exclude keeps open PR previews when the root is replaced.
      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4
        with:
          branch: gh-pages
          folder: dist
          clean-exclude: pr-preview/
          force: false
